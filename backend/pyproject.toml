[project]
name = "review-reply-bot-backend"
version = "0.1.0"
description = "FastAPI backend for Review-Reply Bot (in-memory store, Milestone 3)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.18",
  "bcrypt>=4.1",
  "pyjwt>=2.8",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
